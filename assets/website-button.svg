<svg xmlns="http://www.w3.org/2000/svg" width="520" height="104" viewBox="0 0 520 104" role="img" aria-label="Visit rishabdugarjain.in">
  <title>Visit rishabdugarjain.in</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/><stop offset="1" stop-color="#161B22"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#30363D"/><stop offset=".45" stop-color="#30363D"/>
      <stop offset=".5" stop-color="#58A6FF"/><stop offset=".55" stop-color="#30363D"/><stop offset="1" stop-color="#30363D"/>
      <animate attributeName="x1" values="-1;1" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="3.5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".55" r=".5">
      <stop offset="0" stop-color="#58A6FF" stop-opacity=".22"/><stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="1" y="1" width="518" height="102" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="518" height="102" rx="14" fill="none" stroke="url(#edge)" stroke-width="1.5"/>

  <circle cx="58" cy="54" r="46" fill="url(#halo)">
    <animate attributeName="opacity" values=".7;1;.7" dur="3s" repeatCount="indefinite"/>
  </circle>
  <g transform="translate(24 5) scale(1.12)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-7 30 86;7 30 86;-7 30 86" keyTimes="0;.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" dur="2.4s" repeatCount="indefinite"/>
      <image width="60" height="86" href="data:image/png;base64,"/>
    </g>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
    <rect x="118" y="20" width="74" height="20" rx="10" fill="#58A6FF" fill-opacity=".12" stroke="#58A6FF" stroke-opacity=".35"/>
    <text x="155" y="34" text-anchor="middle" font-size="11" font-weight="600" fill="#58A6FF">Portfolio</text>
    <text x="118" y="68" font-size="26" font-weight="600" fill="#F0F6FC">rishabdugarjain.in</text>
    <text x="118" y="89" font-size="13" fill="#8B949E">Agents, data platforms and a tour guide named Dobby</text>
  </g>

  <g transform="translate(478 52)">
    <circle r="18" fill="#21262D" stroke="#30363D"/>
    <path d="M-6 0 H6 M1 -5 L6 0 L1 5" fill="none" stroke="#F0F6FC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <animateTransform attributeName="transform" type="translate" values="-1.5 0;2 0;-1.5 0" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
